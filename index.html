<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Forgery Detection - Cyber Forensic Unit</title>
    <!-- Cybernetic Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scrollbar-width: thin;
            scrollbar-color: var(--accent-primary) var(--bg-primary);
        }
        :root {
            --bg-primary: #020204;
            --bg-secondary: #0a0f14;
            --bg-tertiary: #111a22;
            --text-primary: #e0faff;
            --text-secondary: #8899a6;
            --accent-primary: #00f3ff;
            --accent-secondary: #0066ff;
            --success: #0aff60;
            --warning: #ffe600;
            --danger: #ff003c;
            --border: #1a2f3a;
            --glass: rgba(10, 15, 20, 0.7);
            --neon-glow: 0 0 10px rgba(0, 243, 255, 0.5), 0 0 20px rgba(0, 243, 255, 0.3);
            --danger-glow: 0 0 10px rgba(255, 0, 60, 0.5);
            --success-glow: 0 0 10px rgba(10, 255, 96, 0.5);
        } 
        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            background-image:
                linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            position: relative;
        }
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: repeating-linear-gradient(0deg,
                    rgba(0, 0, 0, 0.15),
                    rgba(0, 0, 0, 0.15) 1px,
                    transparent 1px,
                    transparent 2px);
            pointer-events: none;
            z-index: 9999;
        }
        body::before {
            content: "";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 80vh;
            background: radial-gradient(circle, rgba(0, 243, 255, 0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: -1;
        }
        h1,
        h2,
        h3,
        h4,
        .nav-brand,
        .score {
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent-primary);
            border-radius: 4px;
        }
        nav {
            background: rgba(2, 2, 4, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--accent-primary);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            position: relative;
        }
        nav::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-primary), transparent);
            box-shadow: 0 0 10px var(--accent-primary);
        }
        .nav-brand {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--accent-primary);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.7);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-brand::before {
            content: '⌬';
            font-size: 1.8rem;
        }
        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }
        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            cursor: pointer;
            padding: 0.5rem 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            transition: all 0.3s ease;
        }
        .nav-links a::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0%;
            height: 2px;
            background: var(--accent-primary);
            transition: width 0.3s ease;
            box-shadow: 0 0 5px var(--accent-primary);
            }
